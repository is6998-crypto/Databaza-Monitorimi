openapi: 3.0.3
info:
  title: 'CourtWatch Researcher API'
  description: 'Read-only API with anonymized, verified court-monitoring data from Kosovo, for approved researchers.'
  version: 1.0.0
servers:
  -
    url: '{{ config("app.url") }}'
tags:
  -
    name: Cases
    description: "\nAnonymized, verified (approved or published) monitored cases."
  -
    name: Parties
    description: "\nAnonymized parties of verified cases: pseudonymous id, role, gender, nationality,\neconomic status, position held, counsel, charges and sentences. Never names."
  -
    name: Hearings
    description: "\nAnonymized, verified monitored hearings (structured answers only)."
  -
    name: Statistics
    description: "\nAggregate indicators (the same suppressed figures as the public portal: values under 5 are null)."
  -
    name: 'Reference data'
    description: "\nCode lists used by the other endpoints (no personal data: judges and prosecutors are not exposed)."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Create a token in the researcher area under <b>API tokens</b> (<code>/research/api-tokens</code>). Only approved researchers who accepted the data-use agreement can create one.'
security:
  -
    default: []
paths:
  /api/v1/cases:
    get:
      summary: 'List cases'
      operationId: listCases
      description: ''
      parameters:
        -
          in: query
          name: type
          description: 'Case type (e.g. criminal_corruption, civil).'
          example: criminal_corruption
          required: false
          schema:
            type: string
            description: 'Case type (e.g. criminal_corruption, civil).'
            example: criminal_corruption
        -
          in: query
          name: court_id
          description: 'Court id (see /reference/courts).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Court id (see /reference/courts).'
            example: 1
        -
          in: query
          name: year
          description: 'Year in which any stage took place.'
          example: 2024
          required: false
          schema:
            type: integer
            description: 'Year in which any stage took place.'
            example: 2024
        -
          in: query
          name: per_page
          description: 'Items per page (max 100).'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Items per page (max 100).'
            example: 25
        -
          in: query
          name: page
          description: 'Page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number.'
            example: 1
        -
          in: query
          name: lang
          description: 'Language of the labels: sq (default) or en.'
          example: en
          required: false
          schema:
            type: string
            description: 'Language of the labels: sq (default) or en.'
            example: en
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      ref: 01JD8Z6Y5P4S7T6W2Q9R1M3K5N
                      code: CW-Q9R1M3K5N
                      type:
                        value: criminal_corruption
                        label: 'Criminal – Corruption'
                      court:
                        id: 1
                        label: 'Basic Court of Prishtina'
                        level: basic
                      department: 'Serious Crimes Department'
                      status: approved
                      parties:
                        total: 3
                        accused: 2
                      stages:
                        -
                          stage: criminal_report_filed
                          label: 'Criminal report filed'
                          date: '2023-01-10'
                          outcome: null
