# Development stack: `docker compose up` starts everything, migrates and seeds fake demo data.
#   App:      http://localhost:8000         (staff panel: /admin, monitor app: /m, researchers: /research)
#   Mailpit:  http://localhost:8025
#   MinIO:    http://localhost:9001         (user: courtwatch / change-me-minio)
name: courtwatch

x-app-env: &app-env
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: courtwatch
    DB_USERNAME: courtwatch
    DB_PASSWORD: change-me
    REDIS_HOST: redis
    MAIL_HOST: mailpit
    MAIL_PORT: "1025"
    AWS_ENDPOINT: http://minio:9000
    CODESPACE_NAME: ${CODESPACE_NAME:-}
    GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}

services:
    app:
        build:
            context: .
            dockerfile: docker/dev/Dockerfile
        image: courtwatch-dev:latest
        command: ["dev-entrypoint", "serve"]
        environment: *app-env
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www/html
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            createbuckets:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15m

    horizon:
        image: courtwatch-dev:latest
        command: ["dev-entrypoint", "horizon"]
        environment: *app-env
        volumes:
            - .:/var/www/html
        depends_on:
            - app

    scheduler:
        image: courtwatch-dev:latest
        command: ["dev-entrypoint", "scheduler"]
        environment: *app-env
        volumes:
            - .:/var/www/html
        depends_on:
            - app

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: courtwatch
            POSTGRES_USER: courtwatch
            POSTGRES_PASSWORD: change-me
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U courtwatch -d courtwatch"]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:7-alpine
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: courtwatch
            MINIO_ROOT_PASSWORD: change-me-minio
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - miniodata:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 5s
            timeout: 5s
            retries: 20

    createbuckets:
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 courtwatch change-me-minio &&
            mc mb --ignore-existing local/courtwatch &&
            mc anonymous set none local/courtwatch
            "

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "8025:8025"
            - "1025:1025"

volumes:
    pgdata:
    miniodata:
